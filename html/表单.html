<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>志愿者募捐表单</title>
		<style>
		.table{
			width: 300px;
			margin:0 auto;/* 表格300px居中 */
			border-collapse:collapse;
		    background-color: aliceblue;
		}
		td,th{
			border:1px solid #bbb;
			padding:8px;
		}
		button{
			border-radius: 3px;
			border:none;
			padding:6px 12px;
			cursor:pointer;
			margin:5px;
		}
		</style>
	</head>
	<body>
		<div style="text-align: center;">
			<form id="donationForm">
			<table class="table">
				<tr>
					<td>志愿者募捐表单</td>
				</tr>
				
				<tr>
					<td>班级</td>
					<td>
						<select id="class">
							<option value="">计算机25级1班</option>
							<option value="">计算机25级2班</option>
							<option value="">计算机25级3班</option>
						</select>
					</td>
				</tr>
				
				<tr>
					<td>捐款类型</td>
					<td>
						<label><input type="radio" name="type" value="现金" checked>现金</label>
						<label><input type="radio" name="type" value="物品" >物品</label>
					</td>
				</tr>
				
				<tr>
					<td>学号</td>
					<td>
						<input type="text" id="student" placeholder="十位学号">
					</td>
				</tr>
				
				<tr>
					<td>姓名</td>
					<td>
						<input type="text" id="name" placeholder="至少两字">
					</td>
				</tr>
				
				<tr>
					<td>金额</td>
					<td>
						<input type="text" id="amount" placeholder="1-100">
					</td>
				</tr>
				
				<tr>
			   <td>
				 <button type="button" id="confirmBtn">确认捐款</button>
				 <button type="button" id="resetBtn">重置</button>
			   </td>
				</tr>
		</table>	
		</form>	
		     <div class="note">学号需十字符</div>
		</div>
	</body>
	
	<script>
		function init(){
			const classSel=
			document.getElementById('class')
		}
		
		
	</script>
</html>
