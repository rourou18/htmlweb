<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传统音乐 · 非遗传承（jQuery版）</title>
    <!-- 引入 jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: #fef7e8;
            color: #2e241f;
        }
        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            background: #fffcf5;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #7c3f1f, #a55d35);
            padding: 1.2rem;
            text-align: center;
            border-bottom: 6px solid #e6bc8e;
            position: relative;
        }
        header h1 {
            font-size: 1.8rem;
            color: #fff3e0;
        }
        .sub {
            color: #fbe6c2;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        #nowTime {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 0.9rem;
        }
        main {
            padding: 1.5rem;
        }
        .back-link {
            display: inline-block;
            background: #c2814a;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            background: #a55d35;
            transform: translateY(-2px);
        }
        .card {
            background: #fff;
            border-radius: 28px;
            padding: 1.8rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            margin-bottom: 1.5rem;
        }
        h2 {
            font-size: 1.5rem;
            border-left: 6px solid #c2814a;
            padding-left: 1rem;
            margin-bottom: 1.2rem;
            color: #4a2a1a;
        }
        h3 {
            font-size: 1.2rem;
            margin: 1.2rem 0 0.6rem;
            color: #8b5a34;
        }
        p {
            margin-bottom: 1rem;
            line-height: 1.6;
        }
        .tag-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 1.2rem 0;
        }
        .tag-list li {
            background: linear-gradient(135deg,#efe0cf,#f3e6d4);
            padding: 8px 18px;
            border-radius: 40px;
            box-shadow:0 4px 10px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tag-list li:hover {
            transform: translateY(-3px);
            box-shadow:0 8px 16px rgba(194,129,74,0.2);
        }
        .tag-list li.active {
            background: linear-gradient(135deg,#c2814a,#a55d35);
            color: white;
        }
        .show-img-box {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
        }
        .show-img-box img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: none;
        }
        .show-img-box .desc-text {
            margin-top: 10px;
            color: #4a2a1a;
            font-weight: 500;
            display: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.2rem 0;
            border-radius:16px;
            overflow:hidden;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #eedbc8;
            text-align: left;
        }
        th {
            background: #efe0cf;
            color: #4f2d15;
        }
        .btn {
            background: linear-gradient(135deg,#c2814a,#a55d35);
            color: white;
            border: none;
            padding: 9px 22px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow:0 8px 16px rgba(194,129,74,0.2);
        }
        .info-bar {
            background: linear-gradient(135deg,#fff0e0,#ffe8d0);
            padding: 1rem;
            border-radius: 16px;
            margin: 1rem 0;
            text-align: center;
            letter-spacing:1px;
        }
        footer {
            background: #2e241f;
            color: #e7cfb5;
            text-align: center;
            padding: 1.2rem;
            font-size: 0.8rem;
            margin-top: 1rem;
        }
        /* 验证码样式 */
        .verify-box {
            margin: 1rem 0;
            text-align: center;
        }
        #verifyCode {
            display: inline-block;
            background: #eee;
            padding: 5px 12px;
            border: 1px solid #333;
            cursor: pointer;
            user-select: none;
            letter-spacing: 3px;
            font-weight: bold;
            color: #333;
        }
        #codeMsg {
            margin-left: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>🎵 天籁之音 · 传统音乐</h1>
        <div class="sub">古琴 · 长调 · 侗族大歌 · 南音</div>
        <div id="nowTime"></div>
    </header>

    <main>
        <a href=" " class="back-link">🏡 返回首页</a >

        <div class="info-bar">
            <div>📅 距离文化和自然遗产日：<span id="countdown"></span></div>
        </div>

        <!-- 新增：验证码功能 -->
        <div class="verify-box">
            <input type="text" id="inputCode" placeholder="请输入验证码">
            <span id="verifyCode"></span>
            <button class="btn" id="checkCodeBtn">验证</button>
            <span id="codeMsg"></span>
        </div>

        <div class="card">
            <h2>🎶 非遗音乐瑰宝</h2>
            <p>传统音乐涵盖古琴艺术、蒙古族长调、侗族大歌等，承载民族记忆与精神内核，2008年起陆续列入人类非遗代表作。</p >

            <h3>📌 点击查看民间音乐</h3>
            <ul class="tag-list">
                <li data-src="./img/微信图片_20260510184838_31_46.jpg" data-desc="蒙古族长调民歌：草原上的天籁之音，悠远辽阔">🏔️ 长调民歌</li>
                <li data-src="./img/微信图片_20260510184837_30_46.jpg" data-desc="侗族大歌：无指挥无伴奏的多声部合唱，自然和谐">🎋 侗族大歌</li>
                <li data-src="./img/微信图片_20260510185359_34_46.jpg" data-desc="西安鼓乐：流传千年的宫廷遗韵，典雅庄重">🎼 西安鼓乐</li>
                <li data-src="./img/微信图片_20260510184840_33_46.jpg" data-desc="南音：福建闽南的古雅清音，被称为音乐活化石">🪕 南音</li>
            </ul>

            <!-- 共用大图显示区 -->
            <div class="show-img-box">
                <img id="musicImage" src="" alt="非遗音乐大图">
                <p class="desc-text"></p >
            </div>

            <h3>🏆 非遗音乐代表作</h3>
            <table id="musicTable">
                <thead>
                    <tr><th>项目名称</th><th>入选年份</th><th>地域特色</th></tr>
                </thead>
                <tbody>
                    <tr><td>古琴艺术</td><td>2008年</td><td>文人音乐，哲学意境</td></tr>
                    <tr><td>蒙古族长调民歌</td><td>2005年</td><td>草原天籁，悠远辽阔</td></tr>
                    <tr><td>侗族大歌</td><td>2009年</td><td>多声部合唱，自然和谐</td></tr>
                </tbody>
            </table>
            <button class="btn" id="addRowBtn">➕ 动态添加非遗项目</button>
        </div>

    </main>

    <footer>
        <p>版权所有 © 2026 非遗传统文化网 | 传统音乐页面</p >
    </footer>
</div>

<script>
    $(function () {
        // ========== 1. 实时系统时间 ==========
        function showTime() {
            const now = new Date();
            $('#nowTime').text(now.toLocaleString());
        }
        setInterval(showTime, 1000);
        showTime();

        // ========== 2. 文化和自然遗产日倒计时 ==========
        function countDown() {
            const now = new Date();
            const year = now.getFullYear();
            let juneFirst = new Date(year, 5, 1);
            let dayOfWeek = juneFirst.getDay();
            let diff = (6 - dayOfWeek + 7) % 7 + 7;
            let heritageDay = new Date(year, 5, diff);
            if (heritageDay < now) {
                heritageDay = new Date(year + 1, 5, diff);
            }
            const diffTime = heritageDay - now;
            const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diffTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            $('#countdown').text(`${days}天${hours}小时`);
        }
        setInterval(countDown, 1000);
        countDown();

        // ========== 3. 验证码功能 ==========
        let verifyCode = "";
        function generateCode() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            verifyCode = "";
            for (let i = 0; i < 4; i++) {
                verifyCode += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            $('#verifyCode').text(verifyCode);
            $('#codeMsg').text("").css("color", "");
        }
        generateCode();
        $('#verifyCode').on('click', generateCode);
        $('#checkCodeBtn').on('click', function () {
            const input = $('#inputCode').val().toUpperCase();
            if (input === verifyCode) {
                $('#codeMsg').text("验证成功").css("color", "green");
            } else {
                $('#codeMsg').text("验证码错误，请重试").css("color", "red");
                generateCode();
            }
        });

        // ========== 4. 点击切换图片 + 淡入动画 ==========
        $('.tag-list li').on('click', function () {
            const src = $(this).data('src');
            const desc = $(this).data('desc');
            // 选中高亮
            $('.tag-list li').removeClass('active');
            $(this).addClass('active');
            // 淡入显示图片和文字
            $('#musicImage').hide().attr('src', src).fadeIn(400);
            $('.desc-text').text(desc).hide().fadeIn(400);
        });

        // ========== 5. 动态表格生成 ==========
        const projects = [
            ["南音", "2009年", "福建闽南，古雅清音"],
            ["西安鼓乐", "2009年", "宫廷遗韵，千年回响"],
            ["昆曲音乐", "2001年", "百戏之祖，婉转唱腔"]
        ];
        $('#addRowBtn').on('click', function () {
            const randomIndex = Math.floor(Math.random() * projects.length);
            const newData = projects[randomIndex];
            const newRow = $('<tr></tr>');
            newRow.append(`<td>${newData[0]}</td>`);
            newRow.append(`<td>${newData[1]}</td>`);
            newRow.append(`<td>${newData[2]}</td>`);
            $('#musicTable tbody').append(newRow);
            // 新行高亮效果
            newRow.css("background-color", "#fff3e0").animate({ backgroundColor: "#fff" }, 1000);
        });

        // ========== 6. 新增：页面滚动动画效果 ==========
        $('html, body').on('scroll', function () {
            const scrollTop = $(window).scrollTop();
            $('.card').each(function () {
                const offsetTop = $(this).offset().top;
                if (scrollTop + $(window).height() > offsetTop + 100) {
                    $(this).css("opacity", 0).animate({ opacity: 1 }, 600);
                }
            });
        });
    });
</script>
</body>
</html>
