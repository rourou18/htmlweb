<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
	</head>
	<body>
		<div class="bmi-card">
			<h1>BMI健康计算器</h1>
			<div>身体质量指数 评估标准</div>
		</div>
		
		<div class="input-group">
			<label >身高（米）</label>
			<div class="input-filed">
				<input type="number" id="height" placeholder="例如7.5" >
				<span class="unit">m</span>
			</div>
		</div>
		
		<div class="input-group">
			<label >体重（公斤）</label>
			<div class="input-filed">
				<input type="weight" id="height" placeholder="例如68.5" >
				<span class="unit">kg</span>
			</div>
		</div>
		
		<div class="button-row">
			<button class="btn-calc" id="calcBtn">计算BMI</button>
			<button class="btn-reset" id="resetBtn">清空重置</button>
		</div>
		<div class="result-panel" id="resultPanel">
		<div class="result-lable">您的BMI指数</div>
		<div class="wait">等待输入</div>
		<div style=""; text-align:center; margin-top:1rem; color:blue>标准</div>
		</div>
	</body>
</html>
