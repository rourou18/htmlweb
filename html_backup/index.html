<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>非遗传统文化 - 首页</title>
    <style>
        :root {
            --primary-color: #8b2323; /* 传统红 */
            --secondary-color: #cda85f; /* 琉璃金 */
            --bg-color: #fcf9f2; /* 宣纸白 */
            --text-main: #333;
            --text-muted: #666;
            --shadow-sm: 0 4px 6px rgba(139, 35, 35, 0.08);
            --shadow-md: 0 8px 15px rgba(139, 35, 35, 0.12);
            --transition: all 0.3s ease;
        }

        body {
                max-width: 1000px;
            margin: 0 auto;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#eadac2 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            padding: 20px;
            line-height: 1.8;
            overflow-x: hidden;
        }
        
        /* 头部设计 */
        header {
            text-align: center;
            padding: 40px 0 20px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.8em;
            letter-spacing: 4px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            position: relative;
            display: inline-block;
        }

        h1::after, h1::before {
            content: '❀';
            color: var(--secondary-color);
            font-size: 0.6em;
            vertical-align: middle;
            margin: 0 15px;
        }

        .subtitle {
            color: #8a6b4e;
            font-size: 1.2em;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* 精彩导航条 */
        nav {
            background: white;
            padding: 15px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow-md);
            margin-bottom: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            border: 1px solid rgba(205, 168, 95, 0.3);
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }
        nav a {
            text-decoration: none;
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: bold;
            transition: var(--transition);
            font-size: 0.95em;
        }
        nav span.divider {
            display: none; /* 隐藏原来的竖线 */
        }
        nav a:hover, nav a.active {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(139, 35, 35, 0.3);
        }

        /* 核心内容区 */
        .content {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            border-top: 5px solid var(--primary-color);
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }
        
        h2 {
            color: var(--primary-color);
            text-align: center;
            font-size: 2em;
            margin-bottom: 30px;
            position: relative;
        }
        h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: var(--secondary-color);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        .intro-text {
            font-size: 1.1em;
            text-indent: 2em;
            color: #4a4a4a;
            margin-bottom: 30px;
        }
        
        .main-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 12px;
            margin: 20px 0 40px;
            display: block;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }
        .main-img:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 20px rgba(0,0,0,0.15);
        }

        /* 重点探索卡片布局 */
        .explore-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }
        .explore-header h3 {
            color: var(--primary-color);
            font-size: 1.5em;
            margin: 0;
            border-left: 4px solid var(--secondary-color);
            padding-left: 15px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 0;
            list-style: none;
        }
        
        .features-grid li {
            margin: 0;
        }

        .features-grid a {
display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            background: white;
            border: 1px solid #f0e6d2;
            border-radius: 12px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            text-align: center;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            height: 100%;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .features-grid a::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary-color);
            z-index: -1;
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s ease-out;
        }

        .features-grid a:hover {
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }
        .features-grid a:hover::before {
            transform: scaleY(1);
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95em;
            padding: 40px 0 20px;
            margin-top: 20px;
            position: relative;
        }
        footer::before {
            content: '❖ ❖ ❖';
            color: var(--secondary-color);
            display: block;
            margin-bottom: 15px;
            opacity: 0.5;
            letter-spacing: 5px;
        }

        /* ECharts 容器样式 */
        #echarts-container {
            width: 100%;
            height: 450px;
            margin: 40px 0;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #f0e6d2;
            transition: var(--transition);
        }
        #echarts-container:hover {

            box-shadow: var(--shadow-md);
        }
    </style>
    <!-- 引入 ECharts 库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
    <header>
        <h1>中国非物质文化遗产</h1>
        <p class="subtitle">传承千年文化 · 守护民族精神家园</p>
    </header>
    <script src="nav.js"></script>

    
    
    


    <div class="content">
        <h2>欢迎走进非遗世界</h2>
        <p class="intro-text">非物质文化遗产是各族人民世代相传的传统文化表现形式，是民族智慧与文明的结晶。它承载着历史的记忆，体现着中华民族的生命力和创造力。</p>
        <p class="intro-text">本网站秉持传承的理念，带您了解传统工艺、音乐、舞蹈、戏曲、美食、节日等国家级非遗文化，感受千年流传的东方美学。</p>
        
        <!-- 保留一张核心配图 -->
        <img src=".\img\微信图片_20260510190537_324_2.jpg" alt="非遗文化宣传图" class="main-img">

        <!-- 新增：非遗数据统计图表 -->
        <div class="explore-header">
            <h3>国家级非遗项目类别分布</h3>
        </div>
        <div id="echarts-container"></div>

        <div class="explore-header">
            <h3>快速探索核心领域</h3>
        </div>
        <ul class="features-grid">
            <li><a href="intro.html">何为非物质文化遗产？</a></li>
            <li><a href="craft.html">传统手工艺的匠心独运</a></li>
            <li><a href="opera.html">传统戏曲的舞台魅力</a></li>
            <li><a href="inherit.html">现代传承与保护工作</a></li>
        </ul>
    </div>

    <footer>
        <p>版权所有 &copy; 2026 非遗传统文化网 | 传承文脉，留住乡愁</p>
    </footer>

    <!-- 图表初始化及 JavaScript 交互脚本 -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 初始化 ECharts 实例
            var chartDom = document.getElementById('echarts-container');
            if (chartDom) {
                var myChart = echarts.init(chartDom);

                // ECharts 配置项与数据（中国国家级非物质文化遗产类别统计参考数据）
                var option = {
                    title: {
                        text: '非物质文化遗产代表性项目分布',
                        subtext: '数据仅供参考，展现非遗的多样性',
                        left: 'center',
                        textStyle: {
                            color: '#8b2323',
                            fontSize: 20,
                            fontFamily: '"Microsoft YaHei", sans-serif'
                        }
                    },
                    tooltip: {
                        trigger: 'item',
                        formatter: '{a} <br/>{b} : {c}项 ({d}%)',
                        backgroundColor: 'rgba(255, 255, 255, 0.9)',
                        borderColor: '#8b2323',
                        textStyle: {
                            color: '#333'
                        }
                    },
                    legend: {
                        bottom: '0',
                        left: 'center',
                        itemWidth: 14,
                        itemHeight: 14,
                        textStyle: {
                            color: '#666',
                            fontSize: 13
                        }
                    },
                    color: [
                        '#8b2323', '#cda85f', '#d98b54', '#8a6b4e', 
                        '#5a7364', '#556b82', '#9f5b5b', '#b38247', 
                        '#7b876a', '#4a4a4a'
                    ],
                    series: [
                        {
                            name: '非遗类别',
                            type: 'pie',
                            radius: ['35%', '60%'],
                            center: ['50%', '45%'],
                            avoidLabelOverlap: true,
                            itemStyle: {
                                borderRadius: 8,
                                borderColor: '#fff',
                                borderWidth: 2
                            },
                            label: {
                                show: true,
                                formatter: '{b}\n{c}项',
                                color: '#4a4a4a',
                                fontSize: 13
                            },
                            emphasis: {
                                label: {
                                    show: true,
                                    fontSize: 16,
                                    fontWeight: 'bold',
                                    color: '#8b2323'
                                },
                                itemStyle: {
                                    shadowBlur: 10,
                                    shadowOffsetX: 0,
                                    shadowColor: 'rgba(139, 35, 35, 0.3)'
                                }
                            },
                            data: [
                                { value: 431, name: '传统技艺' },
                                { value: 298, name: '传统美术' },
                                { value: 247, name: '传统音乐' },
                                { value: 178, name: '传统戏剧' },
                                { value: 165, name: '传统舞蹈' },
                                { value: 137, name: '民俗' },
                                { value: 122, name: '传统医药' },
                                { value: 120, name: '民间文学' },
                                { value: 115, name: '传统体育、杂技' },
                                { value: 95, name: '曲艺' }
                            ]
                        }
                    ]
                };

                // 渲染图表
                myChart.setOption(option);
                
                // 响应窗口大小变化，使图表自适应
                window.addEventListener('resize', function() {
                    myChart.resize();
                });
            }
        });
    </script>
</body>
</html>
