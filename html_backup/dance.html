<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>传统舞蹈 - 非遗传统文化</title>
    <style>
        :root {
            --primary-bg: #FCF4EB;     /* 浅米色背景 */
            --content-bg: #FFFFFF;     /* 内容区白底 */
            --theme-color: #A03125;    /* 传统文化中国红 */
            --text-color: #333333;     /* 深灰文字 */
            --border-color: #E2CBB0;
        }
        body {
            font-family: "Microsoft YaHei", "SimSun", sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            width: 85%;
            max-width: 1000px;
            margin: 20px auto;
            background-color: var(--content-bg);
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            border-top: 5px solid var(--theme-color);
        }
        h1, h2 {
            color: var(--theme-color);
            text-align: center;
        }
        h1 {
            font-size: 2.2em;
            margin-bottom: 20px;
        }
        hr {
            border: 0;
            height: 1px;
            background-image: linear-gradient(to right, rgba(160, 49, 37, 0), rgba(160, 49, 37, 0.5), rgba(160, 49, 37, 0));
            margin: 20px 0;
        }
        nav {
            text-align: center;
            background-color: #F8EBE1;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 30px;
        }
        nav a {
            text-decoration: none;
            color: var(--theme-color);
            font-weight: bold;
            padding: 8px 15px;
            transition: all 0.3s ease;
            display: inline-block;
            border-radius: 4px;
        }
        nav a:hover {
            background-color: var(--theme-color);
            color: #fff;
        }
        .content {
            font-size: 1.15em;
            text-align: justify;
            text-indent: 2em;
            margin-bottom: 30px;
        }
        .gallery {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        .gallery img {
            width: 30%;
            min-width: 250px;
            border-radius: 8px;
            object-fit: cover;
        }
        footer {
            text-align: center;
            color: #777;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px dotted var(--border-color);
            font-size: 0.9em;
        }
        
        /* 添加：简单图集悬浮与模态框展开的 CSS */
        .gallery img {
            cursor: zoom-in;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(160, 49, 37, 0.2);
        }
        
        #img-modal {
            display: none; /* 默认隐藏 */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #img-modal.show {
            display: flex;
            opacity: 1;
        }
        #img-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }
        #img-modal.show img {
            transform: scale(1);
        }
        
        /* 简单图表容器样式 */
        #echarts-dance {
            width: 100%;
            height: 350px;
            margin: 30px auto;
            background: #fff;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
    </style>
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
    <script src="nav.js"></script>

    

    <div class="container">
        <h1>传统舞蹈</h1>
        <hr>
        
    

        
        <h2>舞动神州</h2>
        <p class="content">陕北秧歌、土家族摆手舞、朝鲜族农乐舞等，是广大劳动人民在长期历史发展中创造的具有鲜明民族风格和地方特色的舞蹈形式。</p>
        
        <!-- 新增：ECharts 图表容器 -->
        <div id="echarts-dance"></div>

        <div class="gallery">
            <img src="./img/wechat-image_20260318231442_107_614.jpg" alt="陕北秧歌">
            <img src="./img/wechat-image_20260318231321_105_614.jpg" alt="土家族摆手舞">
            <img src="./img/wechat-image_20260318231410_106_614.jpg" alt="朝鲜族农乐舞">
            <!-- 新增的图片占位示例，你可以替换为真实的本地路径 -->
            <img src="./img/5.jpg" alt="传统民族舞蹈展示1">
            <img src="./img/wechat-image_20260510212541_2_5.jpg" alt="传统民族舞蹈展示2">
        </div>

        <footer>
            <p>版权所有 &copy; 2026 非遗传统文化网</p>
        </footer>
    </div>

    <!-- 简单的图片放大展示层 (Modal) -->
    <div id="img-modal">
        <img id="modal-img" src="" alt="放大图片">
    </div>

    <!-- 交互脚本 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var modal = document.getElementById('img-modal');
            var modalImg = document.getElementById('modal-img');
            var galleryImgs = document.querySelectorAll('.gallery img');

            // 给每个图片增加点击事件，打开模态框并展现大图
            galleryImgs.forEach(function(img) {
                img.addEventListener('click', function() {
                    modalImg.src = this.src; // 将模态框中心图片的源设为当前点击的图片
                    modal.classList.add('show');
                });
            });

            // 点击全屏模态框的任意区域即可关闭
            modal.addEventListener('click', function() {
                modal.classList.remove('show');
                // 等待淡出动画完成后真正隐藏元素
                setTimeout(function() {
                    modalImg.src = "";
                }, 300);
            });

            // 初始化简单的 ECharts (柱状图)
            var chartDom = document.getElementById('echarts-dance');
            if (chartDom) {
                var myChart = echarts.init(chartDom);
                var option = {
                    title: {
                        text: '部分地区传统舞蹈项目数量对比',
                        left: 'center',
                        textStyle: { color: '#A03125', fontSize: 18 }
                    },
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: { type: 'shadow' }
                    },
                    grid: {
                        left: '5%', right: '5%', bottom: '10%', containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        data: ['西北地区', '西南地区', '东北地区', '中南地区', '华北地区'],
                        axisLine: { lineStyle: { color: '#A03125' } },
                        axisLabel: { color: '#555' }
                    },
                    yAxis: {
                        type: 'value',
                        axisLine: { show: true, lineStyle: { color: '#A03125' } },
                        splitLine: { lineStyle: { type: 'dashed', color: '#E2CBB0' } }
                    },
                    series: [
                        {
                            name: '非遗舞蹈项目数',
                            type: 'bar',
                            barWidth: '40%',
                            itemStyle: {
                                color: '#A03125',
                                borderRadius: [4, 4, 0, 0]
                            },
                            data: [35, 48, 20, 42, 28]
                        }
                    ]
                };
                myChart.setOption(option);
                
                // 窗口变化时自适应图表
                window.addEventListener('resize', function() {
                    myChart.resize();
                });
            }
        });
    </script>
</body>
</html>
